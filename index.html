<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎀 アイカツ！アンコール Card Closet</title>
<style>
:root{--pink:#ff8fbe;--pink2:#fff0f7;--purple:#9b82e8;--ink:#403744;--muted:#8d8390;--line:#eee5ec;--bg:#fffafd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:13px 14px 9px}
.title{font-weight:900;font-size:18px}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:6px;overflow:auto;padding-top:10px}.tab{border:0;background:#f7f1f6;border-radius:999px;padding:8px 11px;white-space:nowrap;color:#665d68}.tab.active{background:linear-gradient(135deg,#ff9bc6,#b79af4);color:#fff;font-weight:800}
main{max-width:1000px;margin:auto;padding:13px 10px 80px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:12px;box-shadow:0 3px 15px #7e56740b}
.hero{background:linear-gradient(145deg,#fff5fa,#faf5ff)}.heroTitle{font-weight:900;font-size:15px;letter-spacing:.04em}.heroTitle span{float:right;font-size:10px;color:#a58aa2}
.stats,.coordStats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat,.coordStat{background:var(--pink2);border-radius:13px;padding:10px;text-align:center}.stat b,.coordStat b{display:block;font-size:20px;color:#9b5b8a}.stat span,.coordStat span{font-size:10px;color:var(--muted)}
.progress{height:8px;border-radius:99px;background:#eee5ec;margin:11px 0 5px;overflow:hidden}.progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#ff91be,#a98bea)}.progressText{font-size:11px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid #e6dce5;border-radius:11px;padding:10px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:80px}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:11px;padding:9px 11px;background:#f1eaf1;color:#554b58}.btn.primary{background:linear-gradient(135deg,#ff8fbd,#9f87ea);color:#fff}.btn.small{padding:6px 9px;font-size:12px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.grow{flex:1}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:7px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.card img{width:100%;aspect-ratio:.69;object-fit:cover;display:block;background:#faf7fa}.cardbody{padding:8px}.cid{font-size:11px;font-weight:900}.meta{font-size:10px;color:var(--muted);margin:3px 0 6px}.owned{display:flex;align-items:center;justify-content:space-between}.round{width:29px;height:29px;border:0;border-radius:50%;background:#f4edf4}.count{min-width:28px;text-align:center;font-weight:900}.badge{display:inline-block;border-radius:999px;padding:3px 6px;font-size:9px;margin:1px 2px 4px 0}.want{background:#fff0b8;color:#806500}.trade{background:#ffd9e8;color:#9b3e68}.ok{background:#dcf8e8;color:#26724a}
.coordGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.coordCard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px}.coordCard.done{background:linear-gradient(145deg,#fffafd,#fff7fb);border-color:#e7c7dc}.coordHead{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:8px}.coordHead h3{margin:0;font-size:15px}.ratio{font-weight:900;color:#c05a8c;white-space:nowrap}.miniCards{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.miniCards img{width:100%;aspect-ratio:.69;object-fit:cover;border-radius:6px;background:#faf7fa}.missing{font-size:10px;color:var(--muted);line-height:1.5;margin-top:7px}.coordFilter{display:flex;gap:6px;overflow:auto;margin-top:10px}.coordFilter .active{background:#ffe0ee;color:#a13d6e;font-weight:800}
.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:14px;padding:10px}.item h3{margin:0 0 4px;font-size:14px}.item p{margin:4px 0;color:#6e6470;font-size:11px}.actions{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:26px;text-align:center;color:var(--muted);line-height:1.7}.help{font-size:11px;color:var(--muted);line-height:1.6}dialog{border:0;border-radius:18px;padding:0;width:min(560px,93vw);box-shadow:0 20px 70px #3d263a33}dialog::backdrop{background:#3d263a66}.modal{padding:17px}.modal h2{margin:0 0 13px;font-size:18px}.formgrid{display:grid;gap:9px}
@media(max-width:600px){.filters{grid-template-columns:1fr}.coordGrid{grid-template-columns:1fr}.cardgrid{grid-template-columns:repeat(2,1fr)}main{padding:10px 8px 75px}}
</style>
</head>

<dialog id="modal"><div class="modal" id="modalBody"></div></dialog>

su.com/encore/images/cardlist/card/E1-39_R.webp","rarity":"R"},{"id":"E1-40_R","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-40_R.webp","rarity":"R"},{"id":"E1-41_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-41_N.webp","rarity":"N"},{"id":"E1-42_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-42_N.webp","rarity":"N"},{"id":"E1-43_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-43_N.webp","rarity":"N"},{"id":"E1-44_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-44_N.webp","rarity":"N"},{"id":"E1-45_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-45_N.webp","rarity":"N"},{"id":"E1-46_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-46_N.webp","rarity":"N"},{"id":"E1-47_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-47_N.webp","rarity":"N"},{"id":"E1-48_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-48_N.webp","rarity":"N"},{"id":"E1-49_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-49_N.webp","rarity":"N"},{"id":"E1-50_ER","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-50_ER.webp","rarity":"ER"},{"id":"E1-51_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-51_PR.webp","rarity":"PR"},{"id":"E1-52_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-52_PR.webp","rarity":"PR"},{"id":"E1-53_R","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-53_R.webp","rarity":"R"},{"id":"E1-54_R","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-54_R.webp","rarity":"R"},{"id":"E1-55_R","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-55_R.webp","rarity":"R"},{"id":"E1-56_R","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-56_R.webp","rarity":"R"},{"id":"E1-57_R","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-57_R.webp","rarity":"R"},{"id":"E1-58_R","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-58_R.webp","rarity":"R"},{"id":"E1-59_R","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-59_R.webp","rarity":"R"},{"id":"E1-60_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-60_N.webp","rarity":"N"},{"id":"E1-61_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-61_N.webp","rarity":"N"},{"id":"E1-62_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-62_N.webp","rarity":"N"},{"id":"E1-63_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-63_N.webp","rarity":"N"},{"id":"E1-64_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-64_N.webp","rarity":"N"},{"id":"E1-65_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-65_N.webp","rarity":"N"},{"id":"E1-66_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-66_N.webp","rarity":"N"},{"id":"E1-67_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-67_N.webp","rarity":"N"},{"id":"E1-68_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-68_N.webp","rarity":"N"},{"id":"E1-69_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-69_N.webp","rarity":"N"},{"id":"E1-70_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-70_N.webp","rarity":"N"},{"id":"E1-71_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-71_PR.webp","rarity":"PR"},{"id":"E1-72_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-72_PR.webp","rarity":"PR"},{"id":"E1-73_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-73_PR.webp","rarity":"PR"},{"id":"E1-74_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-74_PR.webp","rarity":"PR"},{"id":"E1-75_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-75_PR.webp","rarity":"PR"},{"id":"E1-76_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-76_PR.webp","rarity":"PR"},{"id":"E1-77_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-77_PR.webp","rarity":"PR"},{"id":"E1-78_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-78_PR.webp","rarity":"PR"},{"id":"E1-79_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-79_PR.webp","rarity":"PR"},{"id":"E1-80_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-80_PR.webp","rarity":"PR"},{"id":"E1-81_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-81_PR.webp","rarity":"PR"},{"id":"E1-82_PR","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-82_PR.webp","rarity":"PR"},{"id":"E1-83_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-83_N.webp","rarity":"N"},{"id":"E1-84_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-84_N.webp","rarity":"N"},{"id":"E1-85_N","img":"https://dcd.aikatsu.com/encore/images/cardlist/card/E1-85_N.webp","rarity":"N"}];
const TABS=[["cards","カード"],["trade","譲・求"],["coord","コーデ"],["array","配列"],["shops","お店"],["history","履歴"]];
const KEY="aikatsuEncoreClosetV4";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{owned:{},wants:{},outfits:[],arrays:[],shops:[],history:[]};
let current="cards",query="",rarity="all",showOnly="all",coordFilter="all";
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function card(id){return CARDS.find(c=>c.id===id)}
function owned(id){return Number(state.owned[id]||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function rarityName(r){return ({PR:"プレミアムレア",R:"レア",N:"ノーマル",ER:"アンコールレア"}[r]||r)}
function addHistory(t){state.history.unshift({time:new Date().toLocaleString("ja-JP"),text:t});state.history=state.history.slice(0,100)}
function setOwned(id,n){n=Math.max(0,Number(n)||0);let old=owned(id);if(n===old)return;state.owned[id]=n;addHistory(`${id}：所持数 ${old} → ${n}`);save();render()}
function toggleWant(id){state.wants[id]=!state.wants[id];save();render()}
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([id,n])=>`<button class="tab ${current===id?"active":""}" onclick="current='${id}';render()">${n}</button>`).join("")}
function render(){renderTabs();document.getElementById("app").innerHTML=current==="cards"?cardsPage():current==="trade"?tradePage():current==="coord"?coordPage():current==="array"?arrayPage():current==="shops"?shopsPage():historyPage()}

function cardsPage(){
 const total=CARDS.reduce((s,c)=>s+owned(c.id),0),unique=CARDS.filter(c=>owned(c.id)>0).length,pct=Math.round(unique/CARDS.length*100);
 let list=CARDS.filter(c=>(!query||c.id.toLowerCase().includes(query.toLowerCase()))&&(rarity==="all"||c.rarity===rarity));
 if(showOnly==="missing")list=list.filter(c=>owned(c.id)===0);if(showOnly==="owned")list=list.filter(c=>owned(c.id)>0);if(showOnly==="trade")list=list.filter(c=>owned(c.id)>=2);
 return `<section class="panel hero"><div class="heroTitle">MY COLLECTION <span>✦ 1st SERIES</span></div><div class="stats">
 <div class="stat"><b>${total}</b><span>総所持枚数</span></div><div class="stat"><b>${unique}/85</b><span>コンプ状況</span></div><div class="stat"><b>${CARDS.filter(c=>owned(c.id)>=2).length}</b><span>譲れる種類</span></div></div>
 <div class="progress"><div style="width:${pct}%"></div></div><div class="progressText">コレクション ${pct}% ・ あと ${85-unique} 種類</div></section>
 <section class="panel"><div class="filters"><input placeholder="🔎 E1-01 など" value="${esc(query)}" oninput="query=this.value;render()"><select onchange="rarity=this.value;render()"><option value="all">レアリティ：すべて</option><option value="PR">PR</option><option value="R">R</option><option value="N">N</option><option value="ER">ER</option></select><button class="btn" onclick="query='';rarity='all';showOnly='all';render()">リセット</button></div>
 <div class="row" style="margin-top:8px"><button class="btn small" onclick="showOnly='all';render()">全部</button><button class="btn small" onclick="showOnly='missing';render()">未所持</button><button class="btn small" onclick="showOnly='owned';render()">所持</button><button class="btn small" onclick="showOnly='trade';render()">譲</button></div></section>
 <section class="cardgrid">${list.map(cardHTML).join("")}</section>`
}
function cardHTML(c){let n=owned(c.id),w=!!state.wants[c.id];return `<article class="card"><img src="${c.img}" alt="${c.id}" loading="lazy" onerror="this.style.opacity=.15"><div class="cardbody"><div class="cid">${c.id}</div><div class="meta">${rarityName(c.rarity)}</div>${w?'<span class="badge want">求</span>':""}${n>=2?'<span class="badge trade">譲</span>':n===1?'<span class="badge ok">所持</span>':""}<div class="owned"><button class="round" onclick="setOwned('${c.id}',${n-1})">−</button><span class="count">${n}</span><button class="round" onclick="setOwned('${c.id}',${n+1})">＋</button></div><button class="btn small" style="margin-top:6px;width:100%" onclick="toggleWant('${c.id}')">${w?"💛 求を外す":"♡ 求にする"}</button></div></article>`}

function tradePage(){let w=CARDS.filter(c=>state.wants[c.id]&&!owned(c.id)),t=CARDS.filter(c=>owned(c.id)>=2);return `<section class="panel"><h2>💌 譲・求</h2><div class="help">2枚以上持っているカードは自動で「譲」に入るよ。</div></section><section class="panel"><h3>求（${w.length}）</h3><div class="list">${w.length?w.map(c=>`<div class=item><b>${c.id}</b>　${rarityName(c.rarity)} <button class="btn small" onclick="toggleWant('${c.id}')">外す</button></div>`).join(""):"<div class=empty>まだ「求」がないよ♡</div>"}</div></section><section class="panel"><h3>譲（${t.length}）</h3><div class=list>${t.length?t.map(c=>`<div class=item><b>${c.id}</b>　所持 ${owned(c.id)}枚</div>`).join(""):"<div class=empty>2枚以上持っているカードがここに出るよ♡</div>"}</div></section>`}

function coordPage(){
 const target=17,done=state.outfits.filter(o=>o.cards.length&&o.cards.every(id=>owned(id)>0)).length,registered=state.outfits.length;
 const pct=Math.min(100,Math.round(done/target*100)),missing=state.outfits.reduce((n,o)=>n+o.cards.filter(id=>owned(id)===0).length,0);
 let list=state.outfits.filter(o=>coordFilter==="all"||(coordFilter==="done"&&o.cards.length&&o.cards.every(id=>owned(id)>0))||(coordFilter==="missing"&&(!o.cards.length||o.cards.some(id=>owned(id)===0))));
 return `<section class="panel hero"><div class="heroTitle">👗 コーデの揃い具合 <span>✦ 1st SERIES</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="progressText"><b>${done} / ${target} コーデ完成</b> ・ 登録 ${registered} コーデ</div>
 <div class="coordStats"><div class="coordStat"><b>${done}</b><span>完成コーデ</span></div><div class="coordStat"><b>${missing}</b><span>あと必要な枚数</span></div><div class="coordStat"><b>${Math.max(0,target-done)}</b><span>未完成コーデ</span></div></div></section>
 <section class="panel"><div class="row"><div class="grow"><h2 style="margin:0">コーデ図鑑</h2><div class="help">カードを登録すると、画像を並べて「あと何枚か」を自動計算するよ♡</div></div><button class="btn primary" onclick="openOutfit()">＋ コーデを登録</button></div><div class="coordFilter"><button class="btn small ${coordFilter==="all"?"active":""}" onclick="coordFilter='all';render()">すべて</button><button class="btn small ${coordFilter==="missing"?"active":""}" onclick="coordFilter='missing';render()">未完成</button><button class="btn small ${coordFilter==="done"?"active":""}" onclick="coordFilter='done';render()">完成</button></div></section>
 <section class="coordGrid">${list.map(o=>{let idx=state.outfits.indexOf(o),need=o.cards.map(id=>({id,have:owned(id),c:card(id)})),m=need.filter(x=>!x.have),d=need.length&&!m.length;return `<article class="coordCard ${d?"done":""}"><div class="coordHead"><h3>${d?"🎉":"✨"} ${esc(o.name)}</h3><div class=ratio>${need.length-m.length} / ${need.length}</div></div><div class=miniCards>${need.map(x=>`<img src="${x.c?.img||""}" style="opacity:${x.have?1:.25}" title="${x.id}">`).join("")}</div><div class=missing>${d?"✨ コーデ完成！":"あと "+m.length+"枚："+m.map(x=>x.id).join("、")}</div><div class=actions><button class="btn small" onclick="openOutfit(${idx})">編集</button><button class="btn small" onclick="deleteOutfit(${idx})">削除</button></div></article>`}).join("")}</section>
 ${!state.outfits.length?'<section class="panel"><div class=empty>まだコーデが登録されてないよ🥹<br>「＋ コーデを登録」から追加してね♡<br><small>公式1弾カードリストは85枚です。</small></div></section>':""}`
}

function openOutfit(index=null){
 let o=index==null?{name:"",cards:[]}:{...state.outfits[index]};
 document.getElementById("modalBody").innerHTML=`<h2>👗 コーデを登録</h2><div class=formgrid><input id="ofName" placeholder="コーデ名　例：オーロラキス" value="${esc(o.name)}"><input id="ofCards" placeholder="E1-01_PR,E1-02_PR,E1-03_PR,E1-04_PR" value="${esc(o.cards.join(","))}"><div class=help>カード番号をカンマ区切りで入れてね。画像が自動で並び、所持数が0のカードは薄く表示されるよ。</div><div class=row><button class="btn primary" onclick="saveOutfit(${index==null?"null":index})">保存</button><button class=btn onclick="closeModal()">キャンセル</button></div></div>`;
 document.getElementById("modal").showModal()
}
function saveOutfit(index){let name=document.getElementById("ofName").value.trim()||"名前なしコーデ";let ids=document.getElementById("ofCards").value.split(/[,、\s]+/).map(x=>x.trim()).filter(Boolean).filter(x=>CARDS.some(c=>c.id===x));ids=[...new Set(ids)];if(!ids.length){alert("カード番号を1枚以上入れてね！");return}let o={name,cards:ids};if(index==null)state.outfits.push(o);else state.outfits[index]=o;addHistory(`コーデ「${name}」を登録`);save();closeModal();render()}
function deleteOutfit(i){if(confirm("このコーデを削除する？")){state.outfits.splice(i,1);save();render()}}
function closeModal(){document.getElementById("modal").close()}

function arrayPage(){return `<section class="panel"><div class=row><div class=grow><h2 style="margin:0">🔮 配列</h2><div class=help>記録した配列から「次に出そうなカード」を探せるよ。</div></div><button class="btn primary" onclick="openArray()">＋ 配列を記録</button></div></section><section class=panel><h3>次のカードを検索</h3><div class=row><input id=seq class=grow placeholder="E1-01_PR,E1-02_PR"><button class="btn primary" onclick=findNext()>照合</button></div><div id=result style="margin-top:8px"></div></section><section class=list>${state.arrays.length?state.arrays.map((a,i)=>`<div class=item><h3>📌 ${esc(a.name)}</h3><p>${a.cards.join(" → ")}</p><div class=actions><button class="btn small" onclick="deleteArray(${i})">削除</button></div></div>`).join(""):"<div class=empty>まだ配列を記録してないよ♡</div>"}</section>`}
function openArray(){document.getElementById("modalBody").innerHTML=`<h2>🔮 配列を記録</h2><div class=formgrid><input id=an placeholder="配列名"><input id=ac placeholder="カード番号を左から順に"><textarea id=ax placeholder="メモ"></textarea><div class=row><button class="btn primary" onclick=saveArray()>保存</button><button class=btn onclick=closeModal()>キャンセル</button></div></div>`;document.getElementById("modal").showModal()}
function saveArray(){let name=document.getElementById("an").value.trim()||"名前なし配列",ids=document.getElementById("ac").value.split(/[,、\s→]+/).filter(x=>CARDS.some(c=>c.id===x));if(!ids.length){alert("カード番号を入れてね！");return}state.arrays.push({name,cards:ids,note:document.getElementById("ax").value.trim()});save();closeModal();render()}
function deleteArray(i){state.arrays.splice(i,1);save();render()}
function findNext(){let q=document.getElementById("seq").value.split(/[,、\s→]+/).filter(Boolean),hits=[];for(let a of state.arrays)for(let i=0;i<=a.cards.length-q.length;i++)if(q.every((v,j)=>a.cards[i+j]===v)&&a.cards[i+q.length])hits.push(a.cards[i+q.length]);document.getElementById("result").innerHTML=hits.length?`<div class=item><b>候補：${[...new Set(hits)].join(" / ")}</b></div>`:"<div class=empty>一致する配列がないよ🥲</div>"}

function shopsPage(){return `<section class=panel><h2>📍 お店</h2><div class=help>公式の「あそべるお店」を開いたり、自分用のお店メモを残せるよ。</div><div class=row style="margin-top:8px"><a class=btn target=_blank href="https://dcd.aikatsu.com/encore/shop/">公式「あそべるお店」</a><button class="btn primary" onclick=openShop()>＋ お店を登録</button></div></section><section class=list>${state.shops.length?state.shops.map((s,i)=>`<div class=item><h3>📍 ${esc(s.name)}</h3><p>${esc(s.address)}</p><p>${esc(s.memo)}</p><button class="btn small" onclick="deleteShop(${i})">削除</button></div>`).join(""):"<div class=empty>まだお店がないよ♡</div>"}</section>`}
function openShop(){document.getElementById("modalBody").innerHTML=`<h2>📍 お店を登録</h2><div class=formgrid><input id=sn placeholder="店名"><input id=sa placeholder="住所"><textarea id=sx placeholder="メモ"></textarea><div class=row><button class="btn primary" onclick=saveShop()>保存</button><button class=btn onclick=closeModal()>キャンセル</button></div></div>`;document.getElementById("modal").showModal()}
function saveShop(){state.shops.push({name:document.getElementById("sn").value.trim()||"名前なし",address:document.getElementById("sa").value.trim(),memo:document.getElementById("sx").value.trim()});save();closeModal();render()}
function deleteShop(i){state.shops.splice(i,1);save();render()}

function historyPage(){return `<section class=panel><div class=row><h2 class=grow style="margin:0">📝 履歴</h2><button class=btn onclick="state.history=[];save();render()">履歴を消す</button></div></section><section class=list>${state.history.length?state.history.map(x=>`<div class=item><b>${esc(x.text)}</b><p>${esc(x.time)}</p></div>`).join(""):"<div class=empty>まだ履歴はないよ♡</div>"}</section>`}
render();
</script>
</body>
</html>
